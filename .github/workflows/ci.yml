# Spark Vault CI 流水线
# 代码 push 或创建 PR 时自动执行：安装依赖 → 类型检查 → 构建

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# 同一分支多次 push 时，取消旧的正在跑的任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # 第 1 步：拉取代码
      - name: Checkout
        uses: actions/checkout@v5

      # 第 2 步：安装 Node.js（并缓存 npm 依赖加速）
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 第 3 步：安装项目依赖（按 lockfile 严格安装）
      - name: Install dependencies
        run: npm ci

      # 第 4 步：类型检查 + 构建（tsc -b && vite build）
      # 注：eslint 未在 devDependencies 中，暂跳过 lint 步骤
      # 安装 eslint 后可在此添加：- run: npm run lint
      - name: Build
        run: npm run build

      # 第 5 步：上传构建产物
      # 注：actions/upload-artifact 当前版本内部仍用 Node 20（GitHub 官方问题）
      # 需要下载产物时取消下面注释；纯构建检查可跳过
      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: dist
      #     path: dist/
      #     retention-days: 7
